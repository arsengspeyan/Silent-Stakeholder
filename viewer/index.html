<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silent Stakeholder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #1a1a1a;
      --gray: #666;
      --light: #e8e8e8;
      --page: #fafafa;

      /* verdicts */
      --ignored-bg: #fef2f2;
      --ignored-border: #e57373;
      --ignored-text: #b91c1c;

      --under-bg: #fffbeb;
      --under-border: #fbbf24;
      --under-text: #b45309;

      --mis-bg: #eff6ff;
      --mis-border: #93c5fd;
      --mis-text: #1d4ed8;

      /* stats */
      --vol-bg: #f0fdf4;
      --vol-text: #15803d;
      --tight-bg: #f5f3ff;
      --tight-text: #6d28d9;
      --gap-bg: #fdf4ff;
      --gap-text: #a21caf;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--black);
      line-height: 1.6;
      padding: 2.5rem 1.25rem 4rem;
    }

    .wrap { max-width: 740px; margin: 0 auto; }

    /* header */
    header {
      background: #fff;
      border: 1px solid var(--light);
      border-left: 4px solid var(--black);
      padding: 1.5rem 1.25rem;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin-top: 0.45rem;
      font-size: 0.9rem;
      color: var(--gray);
    }

    .meta-line {
      margin-top: 0.65rem;
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      color: #888;
    }

    /* sections */
    .section {
      margin-bottom: 2rem;
    }

    .section-headline {
      background: #fff;
      border: 1px solid var(--light);
      padding: 1rem 1.25rem 0.25rem;
    }

    .section-rest {
      background: #fff;
      border: 1px solid var(--light);
      padding: 1rem 1.25rem 0.25rem;
      opacity: 0.95;
    }

    .section-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray);
      padding-bottom: 0.75rem;
      margin-bottom: 0.25rem;
      border-bottom: 2px solid var(--light);
    }

    .section-headline .section-label {
      border-bottom-color: #111;
      color: #111;
    }

    /* gap card */
    .gap {
      padding: 1.25rem 0 1.25rem 0.85rem;
      border-bottom: 1px solid var(--light);
      border-left: 3px solid var(--light);
      margin-left: -0.85rem;
      padding-left: calc(0.85rem + 3px);
    }

    .gap:last-child { border-bottom: none; }

    .gap.verdict-IGNORED {
      border-left-color: var(--ignored-border);
      background: linear-gradient(90deg, var(--ignored-bg) 0%, #fff 55%);
    }

    .gap.verdict-UNDER-PRIORITIZED {
      border-left-color: var(--under-border);
      background: linear-gradient(90deg, var(--under-bg) 0%, #fff 55%);
    }

    .gap.verdict-MISUNDERSTOOD {
      border-left-color: var(--mis-border);
      background: linear-gradient(90deg, var(--mis-bg) 0%, #fff 55%);
    }

    .gap-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.45rem;
    }

    .gap-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .gap-rank { color: #999; font-weight: 500; }

    .gap-score {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      color: #111;
    }

    .gap-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.75rem;
      font-size: 0.72rem;
      color: var(--gray);
    }

    .verdict {
      display: inline-block;
      padding: 0.12rem 0.45rem;
      border-radius: 3px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .verdict-IGNORED .verdict {
      background: var(--ignored-bg);
      color: var(--ignored-text);
      border: 1px solid var(--ignored-border);
    }

    .verdict-UNDER-PRIORITIZED .verdict {
      background: var(--under-bg);
      color: var(--under-text);
      border: 1px solid var(--under-border);
    }

    .verdict-MISUNDERSTOOD .verdict {
      background: var(--mis-bg);
      color: var(--mis-text);
      border: 1px solid var(--mis-border);
    }

    .gap-quote {
      font-size: 0.88rem;
      color: #333;
      margin-bottom: 1rem;
      padding-left: 0.65rem;
      border-left: 2px solid var(--light);
    }

    /* confidence bar */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.65rem;
    }

    .bar-label {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--gray);
      width: 5rem;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .bar-track {
      flex: 1;
      height: 4px;
      background: #eee;
      border-radius: 2px;
    }

    .bar-fill {
      height: 100%;
      background: #333;
      border-radius: 2px;
    }

    .bar-num {
      font-size: 0.72rem;
      font-weight: 600;
      color: #444;
      width: 2.5rem;
      text-align: right;
      flex-shrink: 0;
    }

    /* stat pills */
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }

    .stat {
      font-size: 0.68rem;
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
      font-weight: 500;
    }

    .stat-vol  { background: var(--vol-bg);  color: var(--vol-text); }
    .stat-tight { background: var(--tight-bg); color: var(--tight-text); }
    .stat-gap  { background: var(--gap-bg);  color: var(--gap-text); }

    .formula-line {
      font-family: ui-monospace, monospace;
      font-size: 0.68rem;
      color: #555;
      background: #f9f9f9;
      border: 1px solid var(--light);
      border-radius: 3px;
      padding: 0.45rem 0.6rem;
      margin-bottom: 0.75rem;
      line-height: 1.5;
      word-break: break-word;
    }

    /* evidence */
    .ev-btn {
      background: #fff;
      border: 1px solid var(--light);
      border-radius: 3px;
      padding: 0.3rem 0.6rem;
      font-size: 0.72rem;
      color: #555;
      cursor: pointer;
    }

    .ev-btn:hover {
      border-color: #999;
      color: #111;
    }

    .ev-panel {
      display: none;
      margin-top: 0.85rem;
      padding: 0.85rem;
      background: #f9f9f9;
      border: 1px solid var(--light);
      border-radius: 4px;
    }

    .ev-panel.open { display: block; }

    .ev-heading {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 0.4rem;
    }

    .ev-heading + .ev-heading { margin-top: 0.85rem; }

    .review {
      font-size: 0.82rem;
      padding: 0.55rem 0.65rem;
      margin-bottom: 0.35rem;
      background: #fff;
      border: 1px solid var(--light);
      border-radius: 3px;
      line-height: 1.5;
    }

    .review-id {
      font-family: ui-monospace, monospace;
      font-size: 0.65rem;
      color: #888;
      margin-bottom: 0.2rem;
    }

    .ids {
      font-family: ui-monospace, monospace;
      font-size: 0.68rem;
      color: #555;
      line-height: 1.75;
      word-break: break-all;
    }

    .ids a { color: #1d4ed8; text-decoration: none; }
    .ids a:hover { text-decoration: underline; }

    /* legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.68rem;
      color: var(--gray);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    footer {
      margin-top: 1.5rem;
      padding: 0.85rem 1rem;
      background: #fff;
      border: 1px solid var(--light);
      font-size: 0.68rem;
      color: #888;
      line-height: 1.55;
    }

    .error {
      background: #fff;
      border: 1px solid var(--light);
      padding: 1.25rem;
      font-size: 0.88rem;
    }

    .error code { font-family: ui-monospace, monospace; }

    @media (max-width: 520px) {
      body { padding: 1.5rem 0.75rem 3rem; }
      .gap-top { flex-direction: column; gap: 0.2rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav style="display:flex;gap:1rem;margin-bottom:1.25rem;font-size:.85rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <strong>Results</strong>
      <span style="color:#999">|</span>
      <a href="guide.html" style="color:#1d4ed8;text-decoration:none">Presentation →</a>
    </nav>

    <header>
      <h1>Silent Stakeholder</h1>
      <p id="subtitle">Unmet user needs the PPSSPP roadmap is missing.</p>
      <div class="meta-line">org.ppsspp.ppsspp · hrydgard/ppsspp</div>
    </header>

    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--ignored-border)"></span> Ignored</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--under-border)"></span> Under-prioritized</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--mis-border)"></span> Misunderstood</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--vol-text)"></span> Volume</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--tight-text)"></span> Tightness</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--gap-text)"></span> Gap clarity</span>
    </div>

    <div id="root">Loading…</div>
    <footer id="footer" hidden></footer>
  </div>

<script>
const REPO = "hrydgard/ppsspp";

function pct(n) {
  return (n * 100).toFixed(n === Math.floor(n) ? 0 : 1) + "%";
}

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function verdictClass(v) {
  return "verdict-" + (v || "IGNORED").replace(/\s+/g, "-");
}

function bar(value) {
  const v = Math.min(100, Math.max(0, value * 100));
  return `
    <div class="bar-row">
      <span class="bar-label">Confidence</span>
      <div class="bar-track"><div class="bar-fill" style="width:${v}%"></div></div>
      <span class="bar-num">${v.toFixed(0)}%</span>
    </div>`;
}

function evidence(gap, i) {
  const ids = gap.evidence.review_ids || [];
  const issues = gap.evidence.matched_issue_numbers || [];
  const samples = gap.sample_reviews || [];

  const reviews = samples.map(r => `
    <div class="review">
      <div class="review-id">${esc(r.id)} · ${"★".repeat(r.stars||0)}${"☆".repeat(5-(r.stars||0))} · ${esc(r.date||"")}</div>
      ${esc(r.text)}
    </div>`).join("");

  const idList = ids.slice(0, 12).map(id => esc(id)).join(", ")
    + (ids.length > 12 ? `, +${ids.length - 12} more` : "");

  let issueList = "none";
  if (issues.length) {
    issueList = issues.slice(0, 8).map(n =>
      `<a href="https://github.com/${REPO}/issues/${n}" target="_blank">#${n}</a>`
    ).join(", ");
    if (issues.length > 8) issueList += `, +${issues.length - 8} more`;
  }

  return `
    <button class="ev-btn" onclick="toggle(${i})" id="btn-${i}">
      ${ids.length} reviews · ${issues.length} issues — show evidence
    </button>
    <div class="ev-panel" id="ev-${i}">
      ${samples.length ? `<div class="ev-heading">Sample reviews</div>${reviews}` : ""}
      <div class="ev-heading">Review IDs</div>
      <div class="ids">${idList || "—"}</div>
      <div class="ev-heading">GitHub issues</div>
      <div class="ids">${issueList}</div>
    </div>`;
}

function toggle(i) {
  const panel = document.getElementById(`ev-${i}`);
  const btn = document.getElementById(`btn-${i}`);
  const open = panel.classList.toggle("open");
  btn.textContent = btn.textContent.replace(open ? "show" : "hide", open ? "hide" : "show");
}

function renderGap(gap, i) {
  const b = gap.confidence_breakdown || {};
  const merged = gap.merged_from ? ` · merged ${gap.merged_from.length} clusters` : "";
  const vc = verdictClass(gap.verdict);

  return `
    <article class="gap ${vc}">
      <div class="gap-top">
        <div class="gap-title"><span class="gap-rank">#${gap.rank}</span> ${esc(gap.theme)}</div>
        <div class="gap-score">${gap.confidence_pct}</div>
      </div>
      <div class="gap-meta">
        <span class="verdict">${gap.verdict}</span>
        <span>${gap.review_count} reviews${merged}</span>
      </div>
      <p class="gap-quote">${esc(gap.need)}</p>
      ${bar(gap.confidence)}
      <div class="stats">
        <span class="stat stat-vol">Volume ${pct(b.volume_score ?? 0)}</span>
        <span class="stat stat-tight">Tightness ${pct(b.tightness ?? 0)}</span>
        <span class="stat stat-gap">Gap clarity ${pct(b.gap_clarity ?? 0)}</span>
      </div>
      ${b.formula ? `<div class="formula-line">${esc(b.formula)}</div>` : ""}
      ${evidence(gap, i)}
    </article>`;
}

async function loadGaps() {
  // gaps.json is copied into viewer/ by `make viewer`
  for (const url of ["./gaps.json", "gaps.json"]) {
    const resp = await fetch(url);
    if (resp.ok) return resp.json();
  }
  throw new Error("gaps.json not found in viewer/ folder");
}

async function load() {
  const root = document.getElementById("root");
  try {
    const data = await loadGaps();

    const headline = data.headline_gaps || [];
    const rest = (data.all_gaps || []).filter(g => !g.headline);

    let html = `
      <div class="section section-headline">
        <div class="section-label">Top ${headline.length} unmet needs</div>`;
    headline.forEach((g, i) => { html += renderGap(g, i); });
    html += `</div>`;

    if (rest.length) {
      html += `
      <div class="section section-rest">
        <div class="section-label">All gaps</div>`;
      rest.forEach((g, i) => { html += renderGap(g, headline.length + i); });
      html += `</div>`;
    }

    root.innerHTML = html;

    const footer = document.getElementById("footer");
    const m = data.meta || {};
    footer.innerHTML = `${m.total_gaps ?? "—"} gaps · ${m.headline_count ?? headline.length} headline · confidence = 0.35×volume + 0.2×tightness + 0.45×gap clarity`;
    footer.hidden = false;

  } catch (err) {
    root.innerHTML = `
      <div class="error">
        Could not load <code>gaps.json</code>.<br><br>
        ${esc(err.message)}<br><br>
        From the project folder, run:<br>
        <code>make run</code> then <code>make viewer</code><br><br>
        Do not open this file directly — use the URL <code>http://localhost:8000</code>
      </div>`;
  }
}

load();
</script>
</body>
</html>
